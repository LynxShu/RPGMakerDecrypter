appId: org.lyxshu.rpgmakerdecrypter
productName: RPGMakerDecrypter
copyright: Copyright © 2026 LynxShu

directories:
  output: release
  buildResources: build

# Electron 发行包下载缓存固定到仓库内（.gitignore 已忽略）。
# 默认缓存位置是 %LOCALAPPDATA%\electron\Cache，在没有该目录写权限的终端（受限令牌/沙箱）里
# 打包会报 “mkdir C:\Users\<用户>\AppData\Local\electron: Access is denied”，改这里即可。
electronDownload:
  cache: .electron-cache

files:
  - out/**
  - locales/**
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [x64, arm64]

linux:
  category: Utility
  target:
    - AppImage
